<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 실행 애니메이션 모음</title>
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--text:#e2e8f0;--mute:#94a3b8;--acc:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,'Malgun Gothic',sans-serif;padding:16px}
  h1{font-size:22px;margin:0 0 4px}
  p.sub{margin:0 0 14px;color:var(--mute);font-size:14px}
  .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .menu button{text-align:left;background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-family:inherit;font-size:15px;transition:.15s}
  .menu button:hover{border-color:var(--acc)}
  .menu button.sel{border-color:var(--acc);background:#0c4a6e}
  .menu b{display:block;margin-bottom:4px}
  .menu span{color:var(--mute);font-size:13px}
  .viewer{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
  .bar a{color:var(--acc)}
  iframe{width:100%;height:calc(100vh - 230px);min-height:620px;border:0;background:#fff;display:none}
  .hint{padding:40px 12px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<h1>🎬 코드 실행 애니메이션 모음</h1>
<p class="sub">버튼을 누르면 해당 기능이 아래에 표시됩니다.</p>

<div class="menu" id="menu"></div>

<div class="viewer">
  <div class="bar"><span id="title">기능을 선택하세요</span><a id="open" href="#" target="_blank" style="display:none">새 창에서 열기 ↗</a></div>
  <div class="hint" id="hint">👆 위의 버튼 중 하나를 눌러 보세요.</div>
  <iframe id="frame" title="애니메이션"></iframe>
</div>

<script>
const items=[
  {f:'code_animation.html', t:'1. 숫자 1~100 더하기', d:'변수 sum, for...of 반복문이 한 줄씩 실행되는 모습'},
  {f:'code_animation2.html', t:'2. 객체 배열 합계 (오타 버그)', d:'amout 오타로 NaN이 되는 과정과 수정본 비교'},
  {f:'code_animation3.html', t:'3. 사과 가게 (초등학생용)', d:'상자 · 로봇 · 저금통으로 배우는 반복문'},
  {f:'code_animation4.html', t:'4. 장바구니 계산 놀이', d:'왼쪽 장바구니 + 오른쪽 로직, 50개 데이터'},
  {f:'image_fetch.html', t:'5. 이미지 가져오기 (Pixabay)', d:'검색해서 이미지 주소를 얻고 화면에 출력'}
];
const $=id=>document.getElementById(id);
$('menu').innerHTML=items.map((it,k)=>`<button data-k="${k}"><b>${it.t}</b><span>${it.d}</span></button>`).join('');
$('menu').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const it=items[b.dataset.k];
  document.querySelectorAll('.menu button').forEach(x=>x.classList.toggle('sel',x===b));
  $('hint').style.display='none';
  $('frame').style.display='block';
  $('frame').src=it.f;
  $('title').textContent=it.t;
  $('open').href=it.f; $('open').style.display='';
};
</script>
</body>
</html>
